# Apache HTTP Server Configuration for BUSPASS C CGI Backend
# Place the compiled 'cgi-bin/buspass.cgi' inside Apache's cgi-bin directory
# and copy the built frontend files ('dist/*') into Apache's DocumentRoot.

<Directory "/usr/lib/cgi-bin">
    AllowOverride None
    Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
    AddHandler cgi-script .cgi
    Require all granted
</Directory>

ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
